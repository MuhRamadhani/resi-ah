<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Compress Storage Images</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #0a0e1a;
      color: #e0e0e0;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #a855f7;
    }
    .controls {
      background: #1a1f35;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      background: #a855f7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    button:hover {
      background: #9333ea;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .log {
      background: #0f1424;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 15px;
      height: 500px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
    }
    .log .success { color: #10b981; }
    .log .error { color: #ef4444; }
    .log .warning { color: #f59e0b; }
    .log .info { color: #3b82f6; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat {
      background: #1a1f35;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #a855f7;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>🗜️ Batch Compress Storage Images</h1>
  
  <div class="controls">
    <p>Kompresi gambar lama yang masih besar untuk hemat egress Supabase.</p>
    <button id="startBtn" onclick="startCompression()">▶️ Start Compression</button>
    <button id="pauseBtn" onclick="pauseCompression()" disabled>⏸️ Pause</button>
    <button onclick="clearLog()">🗑️ Clear Log</button>
    <br><br>
    <label>Batch size: <input type="number" id="batchSize" value="50" min="10" max="100" style="width: 60px; padding: 5px; background: #0a0e1a; color: white; border: 1px solid #555; border-radius: 4px;"></label>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="totalProcessed">0</div>
      <div class="stat-label">Processed</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalCompressed">0</div>
      <div class="stat-label">Compressed</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalSkipped">0</div>
      <div class="stat-label">Skipped</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalFailed">0</div>
      <div class="stat-label">Failed</div>
    </div>
  </div>

  <div class="log" id="log"></div>

  <script type="module">
    const SUPABASE_URL = 'https://ytsvvbbsrnoxwlsbaoja.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0c3Z2YmJzcm5veHdsc2Jhb2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDg5MjEwMTgsImV4cCI6MjAyNDQ5NzAxOH0.VuvqeOpBqn2_zG_N2y-6fv0j_lRKj0k_F5X2cWYQE1I';

    let totalProcessed = 0;
    let totalCompressed = 0;
    let totalSkipped = 0;
    let totalFailed = 0;
    let isPaused = false;
    let currentOffset = 0;

    window.startCompression = async function() {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('pauseBtn').disabled = false;
      isPaused = false;
      
      log('info', '🚀 Starting batch compression...');
      
      await runBatch();
    }

    window.pauseCompression = function() {
      isPaused = true;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      log('warning', '⏸️ Paused. Click Start to resume.');
    }

    window.clearLog = function() {
      document.getElementById('log').innerHTML = '';
    }

    async function runBatch() {
      if (isPaused) return;

      const batchSize = parseInt(document.getElementById('batchSize').value);
      
      log('info', `📦 Processing batch at offset ${currentOffset}...`);

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/compress-storage-images`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ limit: batchSize, offset: currentOffset }),
        });

        const data = await response.json();

        if (data.error) {
          log('error', `❌ Error: ${data.error}`);
          pauseCompression();
          return;
        }

        const { summary, results } = data;
        
        totalProcessed += summary.processed;
        totalCompressed += summary.compressed;
        totalSkipped += summary.skipped;
        totalFailed += summary.failed;

        updateStats();

        log('success', `✅ Batch complete: ${summary.compressed} compressed, ${summary.skipped} skipped, ${summary.failed} failed`);

        // Log individual results
        results.forEach(r => {
          if (r.status === 'compressed') {
            log('success', `  ✓ ${r.file}: ${r.original_kb}KB → ${r.compressed_kb}KB (${r.reduction})`);
          } else if (r.status.startsWith('skipped')) {
            log('warning', `  ⊘ ${r.file}: ${r.status}`);
          } else {
            log('error', `  ✗ ${r.file}: ${r.error || r.status}`);
          }
        });

        // Continue if there are more files
        if (summary.processed === batchSize) {
          currentOffset += batchSize;
          setTimeout(() => runBatch(), 1000); // Wait 1 second between batches
        } else {
          log('success', `🎉 All done! Total: ${totalProcessed} processed, ${totalCompressed} compressed, ${totalSkipped} skipped, ${totalFailed} failed`);
          document.getElementById('startBtn').disabled = false;
          document.getElementById('pauseBtn').disabled = true;
        }
      } catch (error) {
        log('error', `❌ Network error: ${error.message}`);
        pauseCompression();
      }
    }

    function updateStats() {
      document.getElementById('totalProcessed').textContent = totalProcessed;
      document.getElementById('totalCompressed').textContent = totalCompressed;
      document.getElementById('totalSkipped').textContent = totalSkipped;
      document.getElementById('totalFailed').textContent = totalFailed;
    }

    function log(type, message) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = type;
      entry.textContent = `[${time}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }
  </script>
</body>
</html>
